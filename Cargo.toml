[workspace]
resolver = "2"
members = [
    "crates/whyfault-trace",
    "crates/whyfault-record",
    "crates/whyfault-decode",
    "crates/whyfault",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KowaiAI/whyfault"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["ptrace", "process", "signal"] }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "op_code_info", "instr_info"] }
gimli = "0.31"
object = "0.36"
addr2line = "0.24"
memmap2 = "0.9"

[profile.release]
debug = 1
